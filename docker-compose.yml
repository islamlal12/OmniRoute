services:
  redis:
    image: redis:8.6.5-alpine
    restart: unless-stopped

    command: redis-server --save 60 1 --loglevel warning

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  omniroute-base:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-base

    image: omniroute:base
    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      NODE_ENV: production

      DATA_DIR: /data
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_HOST: 0.0.0.0
      API_PORT: "20129"

      REDIS_URL: redis://redis:6379

      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      AUTH_COOKIE_SECURE: "true"

      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET}

      NODE_OPTIONS: --max-old-space-size=2048

    volumes:
      - omniroute-data:/data

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  omniroute-data:
  redis-data:
