x-common:
  restart: unless-stopped
  stop_grace_period: 40s
  env_file: .env
  environment:
    - DATA_DIR=/app/data
    - 'OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}'
    - 'PORT=${PORT:-20128}'
    - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
    - 'API_PORT=${API_PORT:-20129}'
    - 'API_HOST=${API_HOST:-0.0.0.0}'
    - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
    - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
    - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
    - 'REDIS_URL=${REDIS_URL:-redis://redis:6379}'
    - NODE_OPTIONS=--max-old-space-size=2048
    - 'OMNIROUTE_CODEX_APPSERVER_WS=${OMNIROUTE_CODEX_APPSERVER_WS:-ws://codex-app-server:1456}'
    - 'OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE=${OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE:-/run/codex-appserver/token}'
  volumes:
    - './data:/app/data'
    - 'codex-appserver-token:/run/codex-appserver'
    - 'codex-appserver-home:/home/node/.codex'
  healthcheck:
    test:
      - CMD
      - node
      - healthcheck.mjs
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
services:
  redis:
    image: 'docker.io/library/redis:8.6.5-alpine'
    container_name: omniroute-redis
    restart: unless-stopped
    ports:
      - '${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis-data:/data'
    command: 'redis-server --save 60 1 --loglevel warning'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
  omniroute-base:
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - 'OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}'
      - 'PORT=${PORT:-20128}'
      - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
      - 'API_PORT=${API_PORT:-20129}'
      - 'API_HOST=${API_HOST:-0.0.0.0}'
      - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
      - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
      - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379}'
      - NODE_OPTIONS=--max-old-space-size=2048
      - 'OMNIROUTE_CODEX_APPSERVER_WS=${OMNIROUTE_CODEX_APPSERVER_WS:-ws://codex-app-server:1456}'
      - 'OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE=${OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE:-/run/codex-appserver/token}'
    volumes:
      - './data:/app/data'
      - 'codex-appserver-token:/run/codex-appserver'
      - 'codex-appserver-home:/home/node/.codex'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: omniroute
    build:
      context: .
      target: runner-base
      args:
        OMNIROUTE_BASE_PATH: '${OMNIROUTE_BASE_PATH:-}'
    image: 'omniroute:base'
    ports:
      - '${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}'
      - '${API_PORT:-20129}:${API_PORT:-20129}'
      - '${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}'
    profiles:
      - base
  omniroute-web:
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - 'PORT=${PORT:-20128}'
      - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
      - 'API_PORT=${API_PORT:-20129}'
      - 'API_HOST=${API_HOST:-0.0.0.0}'
      - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
      - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
      - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379}'
      - 'OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}'
      - 'CHATGPT_WEB_CODEX_CDP_URL=http://chatgpt-web-codex-browser:9223'
    volumes:
      - './data:/app/data'
      - 'codex-appserver-token:/run/codex-appserver'
      - 'codex-appserver-home:/home/node/.codex'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: omniroute
    build:
      context: .
      target: runner-web
      args:
        OMNIROUTE_BASE_PATH: '${OMNIROUTE_BASE_PATH:-}'
    image: 'omniroute:web'
    depends_on:
      chatgpt-web-codex-browser:
        condition: service_started
    ports:
      - '${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}'
      - '${API_PORT:-20129}:${API_PORT:-20129}'
      - '${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}'
    profiles:
      - web
  chatgpt-web-codex-browser:
    build:
      context: .
      dockerfile: docker/chatgpt-web-codex-browser/Dockerfile
    image: 'omniroute:chatgpt-web-codex-browser'
    restart: unless-stopped
    shm_size: 2gb
    volumes:
      - 'chatgpt-web-codex-browser-data:/browser-profile'
    profiles:
      - web
  omniroute-cli:
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - 'OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}'
      - 'PORT=${PORT:-20128}'
      - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
      - 'API_PORT=${API_PORT:-20129}'
      - 'API_HOST=${API_HOST:-0.0.0.0}'
      - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
      - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
      - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
      - 'REDIS_URL=${REDIS_URL:-redis://redis:6379}'
      - NODE_OPTIONS=--max-old-space-size=2048
      - 'OMNIROUTE_CODEX_APPSERVER_WS=${OMNIROUTE_CODEX_APPSERVER_WS:-ws://codex-app-server:1456}'
      - 'OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE=${OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE:-/run/codex-appserver/token}'
    volumes:
      - './data:/app/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro'
      - '${AUTO_UPDATE_HOST_REPO_DIR:-.}:/workspace/omniroute:rw'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: omniroute
    build:
      context: .
      target: runner-cli
      args:
        OMNIROUTE_BASE_PATH: '${OMNIROUTE_BASE_PATH:-}'
    image: 'omniroute:cli'
    ports:
      - '${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}'
      - '${API_PORT:-20129}:${API_PORT:-20129}'
      - '${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}'
    profiles:
      - cli
  omniroute-host:
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - 'PORT=${PORT:-20128}'
      - 'DASHBOARD_PORT=${DASHBOARD_PORT:-20128}'
      - 'API_PORT=${API_PORT:-20129}'
      - 'API_HOST=${API_HOST:-0.0.0.0}'
      - 'LIVE_WS_PORT=${LIVE_WS_PORT:-20132}'
      - 'LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}'
      - 'LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}'
      - CLI_MODE=host
      - 'CLI_EXTRA_PATHS=/host-local/bin:/host-node/bin'
      - CLI_CONFIG_HOME=/host-home
      - CLI_ALLOW_CONFIG_WRITES=true
    volumes:
      - './data:/app/data'
      - '~/.local/bin:/host-local/bin:ro'
      - '~/.codex:/host-home/.codex:rw'
      - '~/.claude:/host-home/.claude:rw'
      - '~/.factory:/host-home/.factory:rw'
      - '~/.openclaw:/host-home/.openclaw:rw'
      - '~/.cursor:/host-home/.cursor:rw'
      - '~/.config/cursor:/host-home/.config/cursor:rw'
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    container_name: omniroute
    build:
      context: .
      target: runner-base
      args:
        OMNIROUTE_BASE_PATH: '${OMNIROUTE_BASE_PATH:-}'
    image: 'omniroute:base'
    ports:
      - '${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}'
      - '${API_PORT:-20129}:${API_PORT:-20129}'
      - '${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}'
    profiles:
      - host
  qdrant:
    image: 'docker.io/qdrant/qdrant:v1.12.4'
    container_name: omniroute-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - 'qdrant-data:/qdrant/storage'
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:6333/readyz'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - memory
  bifrost:
    image: 'ghcr.io/maximhq/bifrost:v1.6.11'
    container_name: omniroute-bifrost
    restart: unless-stopped
    ports:
      - '${BIFROST_PORT:-8080}:8080'
    volumes:
      - 'bifrost-data:/data'
    environment:
      - 'BIFROST_LOG_LEVEL=${BIFROST_LOG_LEVEL:-info}'
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:8080/v1/models'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - bifrost
  cliproxyapi:
    container_name: cliproxyapi
    image: 'docker.io/eceasy/cli-proxy-api:v6.9.7'
    restart: unless-stopped
    ports:
      - '${CLIPROXYAPI_PORT:-8317}:${CLIPROXYAPI_PORT:-8317}'
    volumes:
      - 'cliproxyapi-data:/root/.cli-proxy-api'
    environment:
      - 'PORT=${CLIPROXYAPI_PORT:-8317}'
      - HOST=0.0.0.0
    healthcheck:
      test:
        - CMD
        - wget
        - '--spider'
        - '-q'
        - 'http://127.0.0.1:${CLIPROXYAPI_PORT:-8317}/v1/models'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - cliproxyapi
  codex-app-server:
    image: 'omniroute:base'
    container_name: omniroute-codex-app-server
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - '-c'
    command:
      - "set -e\nTOKEN_FILE=/run/codex-appserver/token\nmkdir -p /run/codex-appserver\nif [ ! -s \"$$TOKEN_FILE\" ]; then\n  # 32-byte hex capability token; shared with the app via the token volume.\n  TF=\"$$TOKEN_FILE\" node -e 'require(\"fs\").writeFileSync(process.env.TF, require(\"crypto\").randomBytes(32).toString(\"hex\"))' 2>/dev/null || \\\n    { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > \"$$TOKEN_FILE\"; }\n  chmod 600 \"$$TOKEN_FILE\"\nfi\nexec codex app-server \\\n  --listen ws://0.0.0.0:1456 \\\n  --ws-auth capability-token \\\n  --ws-token-file \"$$TOKEN_FILE\"\n"
    environment:
      - CODEX_HOME=/home/node/.codex
      - 'RUST_LOG=${CODEX_APPSERVER_RUST_LOG:-warn}'
    volumes:
      - 'codex-appserver-token:/run/codex-appserver'
      - 'codex-appserver-home:/home/node/.codex'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:1456/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - codex-app-server
volumes:
  chatgpt-web-codex-browser-data:
    name: omniroute-chatgpt-web-codex-browser-data
  cliproxyapi-data:
    name: cliproxyapi-data
  redis-data:
    name: omniroute-redis-data
  qdrant-data:
    name: omniroute-qdrant-data
  bifrost-data:
    name: omniroute-bifrost-data
  codex-appserver-token:
    name: omniroute-codex-appserver-token
  codex-appserver-home:
    name: omniroute-codex-appserver-home
